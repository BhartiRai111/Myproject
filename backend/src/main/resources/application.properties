# Application
spring.application.name=storehub-backend
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/storehub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:StoreHubSuperSecretKeyForJwtSigningPleaseChangeInProduction123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Health endpoint (Phase 6 spec: production hardening) — exposes only /actuator/health,
# with just up/down status (no DB connection details, disk space, etc. leaked to callers).
# SecurityConfig already permits this path without authentication.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
